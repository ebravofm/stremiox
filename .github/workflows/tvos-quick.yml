name: tvOS quick build

# Fast iteration build for this fork: only the full tvOS app (StremioXTV), no Lite, iOS or Mac,
# uploaded as a run artifact. Runs on every push to a feature/ branch and on demand. The release
# workflow (release-tvos.yml) is left as upstream has it.

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          echo "xcode_version=$(xcodebuild -version | tr ' \n' '-')" >> "$GITHUB_OUTPUT"
          echo "tvos_sdk=$(xcrun --sdk appletvos --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Rust nightly with rust-src (tvOS is a tier 3 target)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup +nightly target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch server deps (NodeMobile, server.js, subtitle fonts)
        run: ./scripts/fetch-server-deps.sh

      - name: Fetch the macOS node runtime
        # xcodegen validates every target's sources, including the Mac app's node binary.
        run: ./app/scripts/fetch-node-macos.sh

      # Same key as release-tvos.yml, so either workflow reuses the other's engine build.
      - name: Cache stremio-core xcframework
        id: cache-core-xcframework
        uses: actions/cache@v4
        with:
          path: app/Vendor/StremioXCore.xcframework
          key: stremio-core-xcframework-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ steps.toolchain.outputs.tvos_sdk }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml', 'core/rust-toolchain.toml', 'core/src/**', 'core/include/**', 'scripts/build-core-xcframework.sh') }}

      - name: Build the stremio-core xcframework
        if: steps.cache-core-xcframework.outputs.cache-hit != 'true'
        run: ./scripts/build-core-xcframework.sh

      - name: Generate the Xcode project
        run: cd app && xcodegen generate

      # MPVKit is a large download; keep the resolved packages between runs.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: app/build/quick/SourcePackages
          key: spm-tvos-${{ runner.os }}-${{ steps.toolchain.outputs.xcode_version }}-${{ hashFiles('app/project.yml') }}

      - name: Build StremioXTV (unsigned Release)
        run: |
          cd app
          xcodebuild -project StremioX.xcodeproj -scheme StremioXTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            -derivedDataPath build/quick CODE_SIGNING_ALLOWED=NO build

      - name: Package the IPA
        run: |
          mkdir -p out/Payload
          cp -R app/build/quick/Build/Products/Release-appletvos/StremioXTV.app out/Payload/
          (cd out && zip -qry StremioX-tvOS-quick.ipa Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioX-tvOS-quick
          path: out/StremioX-tvOS-quick.ipa
